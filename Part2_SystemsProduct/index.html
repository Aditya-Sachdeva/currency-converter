<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Currency Exchange | Live System Product</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden relative font-sans">

    <!-- Animated Floating Notes Background -->
    <div id="floating-bg" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Header -->
    <header class="relative z-10 w-full p-6 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-wider text-emerald-400">FINTECH<span class="text-slate-100">PULSE</span></h1>
            <p class="text-xs text-slate-400">Live API Foreign Exchange Converter</p>
        </div>
        <div id="api-status" class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live API Connected
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4">
        
        <!-- Converter Card -->
        <div class="w-full max-full max-w-lg bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-emerald-950/30 transition-all duration-300 hover:border-emerald-500/40">
            
            <!-- Interactive Selected Currency Display Note -->
            <div id="currency-note-display" class="w-full h-28 mb-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-800 p-4 flex flex-col justify-between shadow-lg relative overflow-hidden transition-all duration-500 transform scale-100 hover:scale-[1.02]">
                <div class="flex justify-between items-start z-10">
                    <span id="note-symbol" class="text-3xl font-extrabold text-white/90">$</span>
                    <span id="note-code" class="text-sm font-bold tracking-widest text-emerald-200">USD</span>
                </div>
                <div class="z-10">
                    <p class="text-xs text-emerald-100/70 uppercase tracking-wider">Active Currency Note</p>
                    <p id="note-name" class="text-lg font-semibold text-white">United States Dollar</p>
                </div>
                <!-- Decorative Watermark Pattern -->
                <div class="absolute -right-4 -bottom-6 text-8xl font-black text-white/10 select-none pointer-events-none" id="note-watermark">$</div>
            </div>

            <!-- Form -->
            <form id="converter-form" class="space-y-5">
                <!-- Input Amount -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Amount</label>
                    <input type="number" id="amount-input" step="any" value="100" placeholder="Enter amount..."
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xl font-bold text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
                </div>

                <!-- Currency Pickers -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">From</label>
                        <select id="from-currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-200 focus:outline-none focus:border-emerald-500">
                            <option value="USD" selected>USD ($)</option>
                            <option value="INR">INR (₹)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="JPY">JPY (¥)</option>
                            <option value="CAD">CAD (C$)</option>
                            <option value="AUD">AUD (A$)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">To</label>
                        <select id="to-currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-200 focus:outline-none focus:border-emerald-500">
                            <option value="USD">USD ($)</option>
                            <option value="INR" selected>INR (₹)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="JPY">JPY (¥)</option>
                            <option value="CAD">CAD (C$)</option>
                            <option value="AUD">AUD (A$)</option>
                        </select>
                    </div>
                </div>

                <!-- Error Alert Box -->
                <div id="error-box" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs"></div>

                <!-- Convert Button -->
                <button type="submit" id="convert-btn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                    Convert Currency
                </button>
            </form>

            <!-- Result Box -->
            <div id="result-box" class="mt-6 pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400 uppercase tracking-widest">Converted Value</p>
                <h2 id="result-text" class="text-3xl font-black text-emerald-400 mt-1 transition-all">₹8,350.00</h2>
                <p id="rate-info" class="text-xs text-slate-500 mt-2">1 USD = 83.50 INR</p>
            </div>
        </div>

        <!-- Terminal Logs Drawer toggle -->
        <button id="toggle-log-btn" class="mt-6 text-xs text-slate-500 hover:text-slate-300 underline">
            View Live System Logs (app.log)
        </button>
        <div id="log-container" class="hidden mt-4 w-full max-w-lg bg-black border border-slate-800 rounded-xl p-4 text-[10px] font-mono text-emerald-400 h-32 overflow-y-auto"></div>
    </main>

    <footer class="relative z-10 text-center py-4 text-xs text-slate-600">
        Engineered by Aditya Sachdeva &bull; Built for Gagandeep Sir's Assignment
    </footer>

    <script type="module" src="src/app.js"></script>
</body>
</html>
